# Jenkins + Docker-in-Docker, come nella guida ufficiale ma con Compose.
# Jenkins non usa il Docker del Mac: esegue le build nel container "docker" (dind).

services:
  docker:
    image: docker:dind
    privileged: true                # necessario per far girare Docker dentro un container
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    command: --storage-driver overlay2
    networks:
      jenkins:
        aliases: [docker]

  jenkins:
    image: myjenkins-blueocean:lts
    build: .
    restart: on-failure
    depends_on: [docker]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "8080:8080"                 # interfaccia web
      - "50000:50000"               # connessione degli agent
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    networks: [jenkins]

networks:
  jenkins:

volumes:
  jenkins-data:
  jenkins-docker-certs:
